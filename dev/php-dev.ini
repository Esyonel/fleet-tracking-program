; Yerel gelistirme icin PHP ayari. extension_dir komut satirindan verilir:
;   php -d extension_dir="<php klasoru>\ext" -c dev/php-dev.ini -S localhost:8080
extension = pdo_sqlite
extension = sqlite3
extension = mbstring
display_errors = Off
log_errors = On
date.timezone = Europe/Istanbul
upload_max_filesize = 64M
post_max_size = 64M
